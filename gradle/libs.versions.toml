ksp = "2.1.10-1.0.30"
kotlin = "2.1.10"
core-ktx = "1.16.0"
junit = "4.13.2"
androidx-test-ext-junit = "1.2.1"
espresso-core = "3.6.1"
lifecycle-runtime-ktx = "2.8.7"
activity-compose = "1.10.1"
compose-bom = "2025.04.00"
kotlinx-serialization-json = "1.8.0"
